<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Cyan to Purple) -->
    <linearGradient id="csshub-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a6ff" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Code Symbol Gradient -->
    <linearGradient id="csshub-code-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Back Layer: Tilted Vibrant Gradient Squircle -->
  <rect
    x="12"
    y="12"
    width="68"
    height="68"
    rx="20"
    transform="rotate(-12 46 46)"
    fill="url(#csshub-bg-grad)"
  />

  <!-- Front Layer: Dark Card with Thick White Border -->
  <rect
    x="34"
    y="26"
    width="76"
    height="76"
    rx="24"
    fill="#09090f"
    stroke="#ffffff"
    stroke-width="7"
  />

  <!-- Code Brackets & Slash -->
  <!-- Left < bracket -->
  <path
    d="M57 52 L47 64 L57 76"
    fill="none"
    stroke="url(#csshub-code-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Middle / slash -->
  <path
    d="M72 47 L62 81"
    fill="none"
    stroke="url(#csshub-code-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Right > bracket -->
  <path
    d="M77 52 L87 64 L77 76"
    fill="none"
    stroke="url(#csshub-code-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
